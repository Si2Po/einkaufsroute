<script>/* Darstellung (Hell/Dunkel) sofort setzen, damit nichts aufblitzt */ try { var t = localStorage.getItem("ek_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; var a = localStorage.getItem("ek_accent"), r = document.documentElement; if (a) r.dataset.accent = a; if (a === "custom") { var c = JSON.parse(localStorage.getItem("ek_accent_c")); r.style.setProperty("--cust-l", c.l); r.style.setProperty("--cust-d", c.d); r.style.setProperty("--cust-od", c.od); } } catch (e) {}</script>
</head>
<body>
<div id="topcover" aria-hidden="true"></div>
<div class="wrap"><main id="view"></main></div>
<div id="pages"></div>
<nav id="tabbar" aria-label="Bereiche"></nav>
<dialog id="dlg"></dialog>
<!-- Programm in mehreren Dateien. Reihenfolge ist wichtig: grund.js zuerst, start.js als letzte App-Datei, danach sync.js -->
